<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>チラシ伝わり度セルフチェック</title>
    <meta
      name="description"
      content="自作チラシを配る前に、伝わりやすさをサッと確認できる無料セルフチェックページです。"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>チラシ伝わり度セルフチェック</h1>
        <p>
          Canvaなどで作ったチラシを配る前に、<br />
          「ちゃんと伝わるか」をかんたん確認できるページです。
        </p>
      </header>

      <section class="card intro" aria-label="使い方">
        <h2>使い方（1分）</h2>
        <ol>
          <li>手元のチラシを見ながら、あてはまる項目にチェック</li>
          <li>「結果を見る」を押す</li>
          <li>点数とアドバイスを見て、必要なところだけ直す</li>
        </ol>
        <p class="note">※結果はあなたのブラウザ内だけで表示され、保存されません。</p>
      </section>

      <section class="card" aria-labelledby="check-title">
        <h2 id="check-title">チェック項目</h2>
        <form id="checkForm">
          <fieldset>
            <legend class="sr-only">チラシの伝わり度チェック</legend>
            <div id="checkList" class="check-list"></div>
          </fieldset>

          <div class="actions">
            <button type="button" id="resultBtn" class="btn primary">結果を見る</button>
            <button type="reset" id="resetBtn" class="btn secondary">リセット</button>
          </div>
        </form>
      </section>

      <section id="resultArea" class="card result hidden" aria-live="polite">
        <h2>診断結果</h2>
        <p id="scoreText" class="score"></p>
        <p id="levelText" class="level"></p>

        <div class="advice-wrap">
          <h3>改善のヒント</h3>
          <ul id="adviceList"></ul>
        </div>

        <p class="soft-cta">
          ひとりで迷うときは、必要ならデザイナーに相談してみましょう。
        </p>
      </section>
    </main>

    <footer class="footer">
      <small>© チラシ伝わり度セルフチェック</small>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
